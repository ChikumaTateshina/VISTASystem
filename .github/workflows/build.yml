name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VISTASystem.csproj

      - name: Build
        run: dotnet build VISTASystem.csproj -c Release --no-restore

      - name: Publish (self-contained single file)
        run: dotnet publish VISTASystem.csproj -p:PublishProfile=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VISTASystem
          path: publish/VISTASystem.exe
